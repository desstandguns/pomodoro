name: test

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright はリポジトリの外（一時フォルダ）に入れるので、package.json は不要
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run tests
        run: node --test tests/
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
