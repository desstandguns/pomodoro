<!DOCTYPE html>
<html lang="ja" data-phase="work">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポモドーロタイマー</title>
<meta name="description" content="3分・5分・25分・45分・60分の作業と休憩をくり返す、シンプルなタイマー">
<meta name="theme-color" content="#E7EBEF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポモドーロ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 色の設定（作業中は青灰色、休憩中は緑灰色） ===== */
  :root {
    --bg: #E7EBEF;
    --ink: #26303B;
    --sub: #5E6B78;
    --accent: #3D5A73;
    --on-accent: #F5F7F9;
    --tide: #D5DEE6;
    --line: #C2CDD7;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-phase="break"] {
    --bg: #E5ECE3;
    --sub: #5F6E5C;
    --accent: #55734F;
    --tide: #D3E0D0;
    --line: #C1D0BD;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C232B; --ink: #E4E9EE; --sub: #9AA7B4; --accent: #8FB0CC;
      --on-accent: #16202A; --tide: #25303B; --line: #36434F; color-scheme: dark;
    }
    :root:not([data-theme="light"])[data-phase="break"] {
      --bg: #1D2520; --sub: #9DAE99; --accent: #9DC096; --tide: #26342A; --line: #36473B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C232B; --ink: #E4E9EE; --sub: #9AA7B4; --accent: #8FB0CC;
    --on-accent: #16202A; --tide: #25303B; --line: #36434F; color-scheme: dark;
  }
  :root[data-theme="dark"][data-phase="break"] {
    --bg: #1D2520; --sub: #9DAE99; --accent: #9DC096; --tide: #26342A; --line: #36473B;
  }

  /* ===== 全体のレイアウト ===== */
  html { height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 500;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .6s ease;
    overflow: hidden;
  }

  /* 経過時間に合わせて下から満ちていく背景 */
  .tide {
    position: fixed;
    inset: 0;
    background: var(--tide);
    transform-origin: bottom;
    transform: scaleY(0);
    transition: transform .25s linear, background-color .6s ease;
    pointer-events: none;
  }

  main {
    position: relative;
    box-sizing: border-box;
    height: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 32px 24px 28px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;   /* 記録を開いて入りきらないときだけスクロール */
  }

  /* ===== 上部：今のモード ===== */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  /* 4回のうち何回目か（4回目のあとは長い休憩） */
  .cycle {
    font-size: 1rem;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
    transition: color .6s ease;
  }
  .mode {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    transition: color .6s ease;
  }
  .status {
    margin: 6px 0 0;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--sub);
    min-height: 1.6em;
  }

  /* ===== 中央：残り時間 ===== */
  .clock {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock { flex-direction: column; gap: 10px; }
  .ends {
    margin: 0;
    min-height: 1.5em;
    font-size: 1.0625rem;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .time {
    font-size: min(30vw, 9.5rem);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  /* ===== ボタン ===== */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button {
    font: inherit;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    touch-action: manipulation;
    transition: transform .1s ease, background-color .6s ease, color .6s ease;
  }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .primary {
    height: 76px;
    font-size: 1.5rem;
    font-weight: 700;
    background: var(--accent);
    color: var(--on-accent);
  }
  .secondary {
    height: 56px;
    font-size: 1.125rem;
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }

  /* ===== 下部：今日の回数 ===== */
  .today {
    margin: 24px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 1.0625rem;
    color: var(--sub);
  }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; justify-content: flex-end; }
  .dots span {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    transition: background-color .6s ease;
  }
  .count { color: var(--ink); font-weight: 700; white-space: nowrap; }

  /* ===== 作業時間の切り替え（25分・45分・60分） ===== */
  .lengths {
    margin: 20px 0 0;
    display: flex;
    gap: 6px;
  }
  .lengths button {
    flex: 1;
    min-width: 0;
    height: 44px;
    font-size: 1rem;
    background: transparent;
    color: var(--sub);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .lengths button[aria-pressed="true"] {
    color: var(--accent);
    font-weight: 700;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .lengths button:disabled { opacity: .45; cursor: default; }
  .lengths button:disabled:active { transform: none; }

  /* ===== 小さなボタン（音を試す・通知） ===== */
  .extras {
    margin: 14px 0 0;
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .small {
    flex: 0 1 11rem;
    height: 40px;
    font-size: .9375rem;
    background: transparent;
    color: var(--sub);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .small[aria-pressed="true"] {
    color: var(--accent);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  [hidden] { display: none !important; }

  /* ===== 記録（7日分の棒グラフ） ===== */
  .history {
    margin: 8px 0 0;
    color: var(--sub);
    font-size: .9375rem;
  }
  .history summary {
    list-style: none;
    cursor: pointer;
    text-align: center;
    padding: 8px 0;
    border-radius: 999px;
  }
  .history summary::-webkit-details-marker { display: none; }
  .history summary::after {
    content: "▾";
    display: inline-block;
    margin-left: .35em;
    transform: rotate(-90deg);
    transition: transform .2s ease;
  }
  .history[open] summary::after { transform: none; }
  .history summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 4px 4px 0;
  }
  .day {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: .8125rem;
  }
  .day .n { color: var(--ink); font-variant-numeric: tabular-nums; }
  .day .bar {
    width: 100%;
    max-width: 26px;
    height: calc(4px + var(--h, 0) * 52px);   /* 回数に合わせた高さ */
    border-radius: 6px;
    background: var(--line);
    transition: background-color .6s ease;
  }
  .day.today .bar { background: var(--accent); }
  .day.today .w { color: var(--accent); font-weight: 700; }
  .week { margin: 10px 0 2px; text-align: center; }
  .week strong { color: var(--ink); }

  /* ===== 小さい画面（高さが低いスマホ）用に少し詰める ===== */
  @media (max-height: 700px) {
    main { padding: 20px 20px 14px; }
    .lengths { margin-top: 12px; }
    .controls { gap: 10px; }
    .primary { height: 64px; }
    .secondary { height: 48px; }
    .today { margin-top: 14px; }
    .extras { margin-top: 10px; }
    .history { margin-top: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .tide { transition: none !important; }
    button:active { transform: none; }
    .history summary::after { transition: none; }
  }
</style>
</head>
<body>
  <div class="tide" id="tide" aria-hidden="true"></div>

  <main>
    <header>
      <div class="top">
        <p class="mode" id="mode" aria-live="polite">作業</p>
        <span class="cycle" id="cycle" title="4回ごとに長い休憩" aria-label="4回中1回目">1/4</span>
      </div>
      <p class="status" id="status">スタートを押すと25分の作業が始まります</p>
      <div class="lengths" id="lengths" role="group" aria-label="作業時間">
        <button type="button" data-min="3" aria-pressed="false">3分</button>
        <button type="button" data-min="5" aria-pressed="false">5分</button>
        <button type="button" data-min="25" aria-pressed="true">25分</button>
        <button type="button" data-min="45" aria-pressed="false">45分</button>
        <button type="button" data-min="60" aria-pressed="false">60分</button>
      </div>
    </header>

    <div class="clock">
      <div class="time" id="time" role="timer" aria-label="残り時間">25:00</div>
      <p class="ends" id="endsAt"></p>
    </div>

    <div class="controls">
      <button class="primary" id="startBtn" type="button">スタート</button>
      <button class="secondary" id="resetBtn" type="button">リセット</button>
    </div>

    <p class="today">
      <span>今日の完了</span>
      <span class="dots" id="dots" aria-hidden="true"></span>
      <span class="count" id="count">0回</span>
    </p>

    <div class="extras">
      <button class="small" id="testSoundBtn" type="button">音を試す</button>
      <button class="small" id="notifyBtn" type="button" aria-pressed="false" hidden>通知：オフ</button>
    </div>

    <details class="history" id="historyPanel">
      <summary>記録</summary>
      <div class="bars" id="historyBars"></div>
      <p class="week">この7日間の集中 <strong id="weekMinutes">0分</strong></p>
    </details>
  </main>

<!-- 通知の仕組み（なくても動くようにしてある） -->
<script src="push.js"></script>
<script>
  // ===== 設定 =====
  // 作業時間（分）と、そのあとの休憩時間（分）の組み合わせ
  const LENGTHS = { 3: 1, 5: 1, 25: 5, 45: 10, 60: 15 };
  // 4回目の作業のあとの「長い休憩」（分）
  const LONG_BREAKS = { 3: 3, 5: 3, 25: 15, 45: 20, 60: 30 };
  const CYCLE = 4;   // 何回ごとに長い休憩にするか
  const STORAGE_KEY = 'pomodoro-today';
  const LENGTH_KEY = 'pomodoro-length';
  const HISTORY_KEY = 'pomodoro-history';   // 日ごとの完了回数 {"2026-11-02": 3}
  const MINUTES_KEY = 'pomodoro-minutes';   // 日ごとの作業した分数 {"2026-11-02": 75}
  const KEEP_DAYS = 30;                     // 記録を残す日数
  const STATE_KEY = 'pomodoro-state';       // 動いているタイマーの状態（閉じても続きから）

  // 前に選んだ作業時間を思い出す（なければ25分）
  let workMin = 25;
  try {
    const savedMin = Number(localStorage.getItem(LENGTH_KEY));
    if (LENGTHS[savedMin]) workMin = savedMin;
  } catch (e) {}
  let breakMin = LENGTHS[workMin];
  let longBreakMin = LONG_BREAKS[workMin];
  let WORK = workMin * 60 * 1000;     // 作業時間（ミリ秒）

  // ===== 状態 =====
  let phase = 'work';        // 'work' か 'break'
  let remaining = WORK;      // 一時停止中の残り時間
  let endTime = null;        // 動いているときの「終わる時刻」
  let timerId = null;
  let count = 0;
  let done = 0;              // リセットしてから終わった作業の回数（4回ごとに長い休憩）
  let cycleFinished = false; // 長い休憩が終わって止まったところかどうか

  const $ = (id) => document.getElementById(id);

  // 今の休憩（作業中なら次の休憩）が長い休憩かどうか
  function isLongBreak() {
    if (phase === 'work') return (done + 1) % CYCLE === 0;
    return done > 0 && done % CYCLE === 0;
  }
  function breakMinutes() {
    return isLongBreak() ? longBreakMin : breakMin;
  }
  const duration = (p) => (p === 'work' ? WORK : breakMinutes() * 60 * 1000);

  function format(ms) {
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  // ===== タイマーの状態を保存（アプリが閉じられても、開き直したら続きから） =====
  function saveState() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        workMin: workMin, phase: phase, done: done,
        endTime: endTime, remaining: endTime ? null : remaining
      }));
    } catch (e) {}
  }
  function restoreState() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
    // 作業時間が変わっていたり、中身がおかしかったりしたら最初から
    if (!s || s.workMin !== workMin || (s.phase !== 'work' && s.phase !== 'break')) return;
    phase = s.phase;
    done = Math.max(0, Math.floor(Number(s.done) || 0));
    if (typeof s.endTime === 'number' && s.endTime > 0) {
      // 動いていた：そのまま続ける（時間を過ぎていたら tick() が正しく進める）
      endTime = s.endTime;
      timerId = setInterval(tick, 250);
      keepScreenOn();
    } else if (typeof s.remaining === 'number' && s.remaining > 0 && s.remaining <= duration(phase)) {
      remaining = s.remaining;
    } else {
      remaining = duration(phase);
    }
  }

  // ===== 今日の回数（スマホに保存） =====
  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayKey() {
    return dateKey(new Date());
  }
  function loadCount() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && saved.date === todayKey()) return saved.count;
    } catch (e) {}
    return 0;
  }
  function saveCount(n) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: todayKey(), count: n }));
    } catch (e) {}
  }
  function addCount() {
    count = loadCount() + 1;   // 日付が変わっていたら0から数え直す
    saveCount(count);
    addHistory();
    renderCount();
    renderHistory();
  }
  function renderCount() {
    $('count').textContent = count + '回';
    const dots = $('dots');
    dots.innerHTML = '';
    for (let i = 0; i < Math.min(count, 12); i++) {
      dots.appendChild(document.createElement('span'));
    }
    updateBadge();
  }

  // ホーム画面のアイコンに今日の回数を出す（対応している機種だけ）
  function updateBadge() {
    try {
      if (!('setAppBadge' in navigator)) return;
      const p = count > 0 ? navigator.setAppBadge(count) : navigator.clearAppBadge();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ===== 7日間の記録 =====
  function loadMap(key) {
    try {
      const m = JSON.parse(localStorage.getItem(key) || '{}');
      if (m && typeof m === 'object' && !Array.isArray(m)) return m;
    } catch (e) {}
    return {};
  }
  function saveMap(key, m) {
    // 30日より前の記録は消す（日付の文字列はそのまま大小をくらべられる）
    const limit = new Date();
    limit.setDate(limit.getDate() - KEEP_DAYS);
    const oldest = dateKey(limit);
    Object.keys(m).forEach((k) => { if (k < oldest) delete m[k]; });
    try { localStorage.setItem(key, JSON.stringify(m)); } catch (e) {}
  }
  function addHistory() {
    const today = todayKey();
    const history = loadMap(HISTORY_KEY);
    history[today] = count;
    saveMap(HISTORY_KEY, history);
    const minutes = loadMap(MINUTES_KEY);
    // 記録を始める前の回数は、今の長さで数えておく
    if (typeof minutes[today] !== 'number') minutes[today] = (count - 1) * workMin;
    minutes[today] += workMin;
    saveMap(MINUTES_KEY, minutes);
  }
  function renderHistory() {
    const history = loadMap(HISTORY_KEY);
    const minutes = loadMap(MINUTES_KEY);
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = dateKey(d);
      const n = Number(history[key]) || 0;
      const min = typeof minutes[key] === 'number' ? minutes[key] : n * 25;
      days.push({ d, n, min, today: i === 0 });
    }
    const max = Math.max(1, ...days.map((x) => x.n));
    const bars = $('historyBars');
    bars.innerHTML = '';
    let total = 0;
    days.forEach((x) => {
      total += x.min;
      const col = document.createElement('div');
      col.className = 'day' + (x.today ? ' today' : '');
      col.style.setProperty('--h', x.n / max);
      const label = '日月火水木金土'[x.d.getDay()];
      col.setAttribute('aria-label', (x.today ? '今日' : label + '曜日') + ' ' + x.n + '回');
      col.innerHTML = '<span class="n">' + x.n + '</span><span class="bar"></span><span class="w">' + label + '</span>';
      bars.appendChild(col);
    });
    $('weekMinutes').textContent = total + '分';
  }

  // ===== 音（ファイルを使わず、その場で鳴らす） =====
  let audioCtx = null;
  function prepareAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // iPhoneで音を使えるようにするための無音再生
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) {}
  }
  // workEnded が true なら作業終わりの音（上がる3音）、false なら休憩終わりの音（下がる3音）
  // times の回数だけくり返す（時間になったときは気付きやすいよう2回）
  function chime(workEnded, times) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const phrase = workEnded ? [659.25, 783.99, 1046.5] : [1046.5, 783.99, 659.25];
      let notes = [];
      for (let r = 0; r < (times || 1); r++) notes = notes.concat(phrase);
      const t0 = audioCtx.currentTime + 0.05;
      notes.forEach((freq, j) => {
        const i = j % 3;
        const round = Math.floor(j / 3);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = t0 + round * 2.2 + i * 0.35;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 1.5);
      });
    } catch (e) {}
  }

  // ===== バイブ（Androidのみ。iPhoneは非対応） =====
  function vibrate() {
    try {
      if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    } catch (e) {}
  }

  // ===== 通知（push.js があるときだけ使う） =====
  function push() {
    return window.PomodoroPush || null;
  }
  // 失敗しても画面にエラーを出さないようにする
  function quiet(p) {
    if (p && typeof p.then === 'function') p.then(null, () => {});
  }
  // 今のモードが終わる時刻に通知を予約する
  function schedulePush() {
    const P = push();
    if (!P || !endTime) return;
    let title, body;
    if (phase === 'work') {
      title = '作業おわり';
      body = isLongBreak() ? longBreakMin + '分の長い休憩です' : breakMin + '分休憩しましょう';
    } else {
      title = '休憩おわり';
      body = '次の作業を始めましょう';
    }
    try { quiet(P.schedule({ at: endTime, title: title, body: body })); } catch (e) {}
  }
  function cancelPush() {
    const P = push();
    if (!P) return;
    try { quiet(P.cancel()); } catch (e) {}
  }

  let notifyOn = false;
  // 通知ボタンの表示を今の状態に合わせる
  async function refreshNotify() {
    const btn = $('notifyBtn');
    const P = push();
    let supported = false;
    let needsHome = false;
    try {
      if (P) {
        supported = !!P.isSupported();
        needsHome = !!P.needsHomeScreen();
      }
    } catch (e) {}
    if (!P || (!supported && !needsHome)) {
      btn.hidden = true;
      return;
    }
    btn.hidden = false;
    notifyOn = false;
    if (!needsHome) {
      try { notifyOn = !!(await P.isEnabled()); } catch (e) {}
    }
    btn.textContent = notifyOn ? '通知：オン' : '通知：オフ';
    btn.setAttribute('aria-pressed', notifyOn ? 'true' : 'false');
  }
  async function toggleNotify() {
    const P = push();
    if (!P) return;
    try {
      if (P.needsHomeScreen()) {
        $('status').textContent = '通知はホーム画面に追加したアプリで使えます';
        return;
      }
      // enable() は押した直後に呼ぶ（許可の画面を出すため）
      if (notifyOn) await P.disable();
      else await P.enable();
    } catch (e) {}
    await refreshNotify();
    let perm = null;
    try { perm = await P.permission(); } catch (e) {}
    if (perm === 'denied') {
      $('status').textContent = '通知がブロックされています。ブラウザの設定で許可してください';
    } else if (notifyOn && endTime) {
      schedulePush();
    }
  }

  // ===== 画面が自動で消えないようにする =====
  let wakeLock = null;
  async function keepScreenOn() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  function allowScreenOff() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  // ===== 画面の更新 =====
  function timeLeft() {
    return endTime ? Math.max(0, endTime - Date.now()) : remaining;
  }
  function render() {
    const left = timeLeft();
    $('time').textContent = format(left);
    document.title = (endTime ? format(left) + ' ' : '') + 'ポモドーロタイマー';
    const progress = 1 - left / duration(phase);
    $('tide').style.transform = 'scaleY(' + progress + ')';
  }
  function update() {
    document.documentElement.dataset.phase = phase;
    const long = isLongBreak();
    $('mode').textContent = phase === 'work' ? '作業' : (long ? '長い休憩' : '休憩');

    // 4回のうち何回目か（休憩中は、いま終えた回）
    const n = phase === 'work' ? (done % CYCLE) + 1 : ((done - 1) % CYCLE) + 1;
    $('cycle').textContent = n + '/' + CYCLE;
    $('cycle').setAttribute('aria-label', CYCLE + '回中' + n + '回目');

    const running = endTime !== null;
    const untouched = remaining === duration(phase);
    const btn = $('startBtn');
    if (running) btn.textContent = '一時停止';
    else btn.textContent = untouched ? 'スタート' : '再開';

    let status;
    if (running) {
      if (phase === 'work') status = long ? '終わったら' + longBreakMin + '分の長い休憩です' : '終わったら' + breakMin + '分休憩です';
      else status = '終わったら次の作業が始まります';
    } else if (!untouched) status = '一時停止中';
    else if (cycleFinished) status = 'おつかれさまでした。スタートで次の作業へ';
    else if (phase === 'work') status = 'スタートを押すと' + workMin + '分の作業が始まります';
    else status = long ? 'スタートを押すと' + longBreakMin + '分の長い休憩が始まります' : 'スタートを押すと' + breakMin + '分の休憩が始まります';
    $('status').textContent = status;

    // 作業時間のボタン：選んでいるものを目立たせ、動いている間は押せないようにする
    document.querySelectorAll('#lengths button').forEach((b) => {
      b.setAttribute('aria-pressed', Number(b.dataset.min) === workMin ? 'true' : 'false');
      b.disabled = running;
    });

    // 終わる時刻（例：14:25 に終わります）
    let ends = '';
    if (running) {
      const d = new Date(endTime);
      ends = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') + ' に終わります';
    }
    $('endsAt').textContent = ends;

    render();
    updateBarColor();
  }

  // スマホ上部のバーの色を、今の背景色に合わせる
  function updateBarColor() {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    requestAnimationFrame(() => {
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (bg) meta.setAttribute('content', bg);
    });
  }

  // ===== タイマーの動き =====
  function tick() {
    if (!endTime) return;
    let switched = false;
    // 時間を過ぎていたら次のモードへ（ほかのアプリから戻ったときも正しく進む）
    // 回数を先に数えるので、4回目のあとは長い休憩の長さで進む
    // 長い休憩が終わったら、そこで止まって待つ（つけっぱなしで回数が増え続けないように）
    while (endTime && Date.now() >= endTime) {
      switched = true;
      if (phase === 'work') {
        addCount();
        done++;
        phase = 'break';
        endTime += duration(phase);
      } else if (isLongBreak()) {
        phase = 'work';
        endTime = null;
        remaining = WORK;
        cycleFinished = true;
        clearInterval(timerId);
        allowScreenOff();
      } else {
        phase = 'work';
        endTime += duration(phase);
      }
    }
    if (switched) {
      chime(phase === 'break', 2);
      vibrate();
      update();
      schedulePush();
      saveState();
    } else {
      render();
    }
  }
  function start() {
    prepareAudio();
    cycleFinished = false;
    endTime = Date.now() + remaining;
    clearInterval(timerId);
    timerId = setInterval(tick, 250);
    keepScreenOn();
    update();
    schedulePush();
    saveState();
  }
  function pause() {
    remaining = timeLeft();
    endTime = null;
    clearInterval(timerId);
    allowScreenOff();
    cancelPush();
    update();
    saveState();
  }
  function reset() {
    clearInterval(timerId);
    endTime = null;
    allowScreenOff();
    cancelPush();
    phase = 'work';
    done = 0;
    cycleFinished = false;
    remaining = WORK;
    update();
    saveState();
  }

  $('startBtn').addEventListener('click', () => (endTime ? pause() : start()));
  $('resetBtn').addEventListener('click', reset);

  // 音を試す：タイマーはそのままで、作業終わりの音とバイブだけ鳴らす
  $('testSoundBtn').addEventListener('click', () => {
    prepareAudio();
    chime(true);
    vibrate();
  });

  $('notifyBtn').addEventListener('click', toggleNotify);

  // キーボードのスペースでスタート／一時停止（ボタンを選んでいるときは除く）
  document.addEventListener('keydown', (e) => {
    if (e.key !== ' ' && e.code !== 'Space') return;
    if (e.repeat || (e.target.closest && e.target.closest('button, summary, a, input, textarea, select'))) return;
    e.preventDefault();
    if (endTime) pause();
    else start();
  });

  // 作業時間を選んだとき：新しい長さで作業の最初からにする
  function chooseLength(min) {
    if (endTime || !LENGTHS[min]) return;
    workMin = min;
    breakMin = LENGTHS[min];
    longBreakMin = LONG_BREAKS[min];
    WORK = workMin * 60 * 1000;
    try { localStorage.setItem(LENGTH_KEY, String(min)); } catch (e) {}
    reset();
  }
  document.querySelectorAll('#lengths button').forEach((b) => {
    b.addEventListener('click', () => chooseLength(Number(b.dataset.min)));
  });

  // 記録を開いたら、見えるところまでスクロールする
  $('historyPanel').addEventListener('toggle', () => {
    if (!$('historyPanel').open) return;
    renderHistory();
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('historyPanel').scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
  });

  // 別のアプリから戻ってきたとき
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      count = loadCount();
      renderCount();
      renderHistory();
      tick();
      if (endTime) keepScreenOn();
    }
  });

  // ===== 起動時 =====
  count = loadCount();
  renderCount();
  renderHistory();
  restoreState();
  update();
  tick();
  // ページの準備ができてから通知ボタンを整える（push.js がなければ隠したまま）
  document.addEventListener('DOMContentLoaded', refreshNotify);

  // ダークモードの切り替えに合わせてバーの色も変える
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateBarColor);
  } catch (e) {}

  // ===== アプリとして使えるようにする（サービスワーカーの登録） =====
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
